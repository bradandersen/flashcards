<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greek Flashcards</title>
<link rel="stylesheet" href="css/app.css">

</head>
<body>
<div class="app-toolbar">
  <div class="app-toolbar-left">
    <div class="zoom-bar">
      <span class="zoom-word">Zoom:</span>
      <button class="zoom-btn" id="zoomOut" title="Zoom out">−</button>
      <span class="zoom-label" id="zoomLabel">100%</span>
      <button class="zoom-btn" id="zoomIn" title="Zoom in">+</button>
    </div>
  </div>
  <div class="app-toolbar-center">
    <h1 id="appTitle">Flashcards</h1>
  </div>
  <div class="app-toolbar-right">
    <div class="lang-pair" title="Choose language pair">
      <label for="fromLang">From</label>
      <select id="fromLang" aria-label="From language (UI language)">
        <option value="el">Ελληνικά (Greek)</option>
        <option value="en" selected>English</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="it">Italiano</option>
        <option value="de">Deutsch</option>
        <option value="nl">Nederlands</option>
        <option value="pt">Português</option>
      </select>
      <button type="button" class="lang-swap" id="langSwap" title="Swap languages" aria-label="Swap languages">⇄</button>
      <label for="toLang">To</label>
      <select id="toLang" aria-label="To language (target)">
        <option value="el" selected>Ελληνικά (Greek)</option>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="it">Italiano</option>
        <option value="de">Deutsch</option>
        <option value="nl">Nederlands</option>
        <option value="pt">Português</option>
      </select>
    </div>
  </div>
</div>
<div class="subtitle" id="appSubtitle" hidden></div>

<div class="search-wrap" id="searchWrap">
  <input type="search" class="search-input" id="searchInput" placeholder="Search…" autocomplete="off" spellcheck="false">
  <div class="search-results" id="searchResults" role="listbox"></div>
</div>

<div class="main-tabs">
<button class="main-tab active" data-main="alphabet">Alphabet</button>
<button class="main-tab" data-main="verbs">Verbs</button>
<button class="main-tab" data-main="nouns">Nouns</button>
<button class="main-tab" data-main="adjectives">Adjectives</button>
<button class="main-tab" data-main="adverbs">Adverbs</button>
<button class="main-tab" data-main="calendar">Calendar</button>
<button class="main-tab" data-main="roots">Roots</button>
<button class="main-tab" data-main="phrases">Phrases</button>
<button class="main-tab" data-main="other">Other</button>
<button class="main-tab" data-main="tests">Tests</button>
</div>

<!-- Alphabet filters -->
<div class="filters" id="alphabetFilters">
<button class="filter-btn active" data-mode="all">All</button>
<button class="filter-btn" data-mode="vowels">Vowels</button>
<button class="filter-btn" data-mode="consonants">Consonants</button>
<button class="filter-btn" data-mode="tricky">Tricky</button>
</div>

<!-- Verb filters -->
<div class="filters hidden" id="verbClassFilters">
<button class="filter-btn active" data-vclass="all">All Classes</button>
<button class="filter-btn" data-vclass="irregular">Irregular</button>
<button class="filter-btn" data-vclass="regular">Regular -ω</button>
<button class="filter-btn" data-vclass="contracted">Contracted</button>
<button class="filter-btn" data-vclass="deponent">Deponent</button>
</div>
<div class="filters hidden" id="verbTenseFilters">
<button class="filter-btn active" data-vtense="present">Present</button>
<button class="filter-btn" data-vtense="aorist">Aorist (Past)</button>
<button class="filter-btn" data-vtense="future">Future</button>
</div>

<!-- Noun filters -->
<div class="filters hidden" id="nounFilters">
<button class="filter-btn active" data-ncat="all">All</button>
<button class="filter-btn" data-ncat="family">Family</button>
<button class="filter-btn" data-ncat="places">Places</button>
<button class="filter-btn" data-ncat="food">Food & Drink</button>
<button class="filter-btn" data-ncat="body">Body</button>
<button class="filter-btn" data-ncat="things">Things</button>
<button class="filter-btn" data-ncat="nature">Nature</button>
<button class="filter-btn" data-ncat="work">Work & School</button>
<button class="filter-btn" data-ncat="island">Island / Travel</button>
<button class="filter-btn" data-ncat="clothing">Clothing</button>
<button class="filter-btn" data-ncat="household">Household</button>
<button class="filter-btn" data-ncat="animals">Animals</button>
<button class="filter-btn" data-ncat="garden">Garden & Tools</button>
<button class="filter-btn" data-ncat="kitchen">Kitchen/Grocery</button>
</div>
<div class="filters hidden" id="nounGenderFilters">
<button class="filter-btn active" data-ngender="all">All Genders</button>
<button class="filter-btn" data-ngender="m">Masculine (ο)</button>
<button class="filter-btn" data-ngender="f">Feminine (η)</button>
<button class="filter-btn" data-ngender="n">Neuter (το)</button>
</div>

<!-- Adjective filters -->
<div class="filters hidden" id="adjFilters">
<button class="filter-btn active" data-acat="all">All</button>
<button class="filter-btn" data-acat="quality">Quality</button>
<button class="filter-btn" data-acat="size">Size</button>
<button class="filter-btn" data-acat="color">Color</button>
<button class="filter-btn" data-acat="feeling">Feeling</button>
<button class="filter-btn" data-acat="quantity">Quantity</button>
</div>

<!-- Calendar filters -->
<div class="filters hidden" id="calendarFilters">
<button class="filter-btn active" data-ccat="all">All</button>
<button class="filter-btn" data-ccat="numbers">Numbers</button>
<button class="filter-btn" data-ccat="days">Days</button>
<button class="filter-btn" data-ccat="months">Months</button>
<button class="filter-btn" data-ccat="seasons">Seasons</button>
<button class="filter-btn" data-ccat="clock">Clock</button>
<button class="filter-btn" data-ccat="frequency">Frequency</button>
<button class="filter-btn" data-ccat="weights">Weights</button>
<button class="filter-btn" data-ccat="timewords">Time Words</button>
</div>

<!-- Roots filters -->
<div class="filters hidden" id="rootsFilters">
<button class="filter-btn active" data-rcat="all">All</button>
<button class="filter-btn" data-rcat="prefix">Prefixes</button>
<button class="filter-btn" data-rcat="verb">Verb roots</button>
<button class="filter-btn" data-rcat="noun">Noun roots</button>
<button class="filter-btn" data-rcat="number">Numbers</button>
<button class="filter-btn" data-rcat="body">Body / nature</button>
<button class="filter-btn" data-rcat="suffix">Suffixes</button>
</div>

<!-- Phrases filters -->
<div class="filters hidden" id="phrasesFilters">
<button class="filter-btn active" data-pcat="all">All</button>
<button class="filter-btn" data-pcat="survival">Survival</button>
<button class="filter-btn" data-pcat="social">Social</button>
<button class="filter-btn" data-pcat="food">Food / shop</button>
<button class="filter-btn" data-pcat="travel">Travel</button>
<button class="filter-btn" data-pcat="opinions">Opinions</button>
<button class="filter-btn" data-pcat="patterns">Sentence patterns</button>
<button class="filter-btn" data-pcat="local">Local customs</button>
</div>

<div class="stats" id="stats">Card <span id="current">1</span> of <span id="total">24</span></div>
<div class="progress-bar" id="progressWrap">
  <input type="range" id="cardSlider" min="1" max="24" value="1" step="1" aria-label="Jump to card">
</div>

<div class="flashcard-container" id="cardContainer">
<div class="flashcard" id="flashcard">
<div class="flashcard-face flashcard-front">
<div class="letter" id="frontMain">Α α</div>
<div class="roman-word" id="frontSub">alpha</div>
<div class="hint" id="flipHint">Click or Space to flip</div>
</div>
<div class="flashcard-face flashcard-back"><div id="backContent"></div></div>
</div>
</div>

<div class="controls" id="cardControls">
<button class="btn btn-prev" id="prevBtn">← Prev</button>
<button class="btn btn-shuffle" id="shuffleBtn">Shuffle</button>
<button class="btn btn-next" id="nextBtn">Next →</button>
</div>
<div class="keyboard-hint" id="keyboardHint">← → navigate · Space flip · S shuffle</div>

<div id="testPanel" class="test-panel hidden"></div>

<div class="digraphs-section hidden" id="digraphsSection">
<h2 id="digraphsH2">Common Digraphs & Pronunciation</h2>
<div class="digraphs-grid" id="digraphsGrid"></div>
<p class="section-note" id="digraphsNote"></p>
</div>

<div class="modal-overlay hidden" id="exampleModal">
  <div class="modal-box">
    <h3>Example sentence</h3>
    <div class="modal-ex-g" id="modalExG"></div>
    <div class="modal-ex-r" id="modalExR"></div>
    <div class="modal-ex-e" id="modalExE"></div>
    <button class="modal-close" id="modalClose">Close</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/tests.js"></script>
<footer class="app-footer">Developed by Andelorean Enterprises, Cocoa Beach, FL</footer>
<div class="app-version" id="appVersion">Version 1.0.5 (27.08.2026.00)</div>
</body>
</html>
